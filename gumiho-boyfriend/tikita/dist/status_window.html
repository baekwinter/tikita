<div style="display:flex;flex-wrap:wrap;gap:6px;font-size:12px;line-height:1.4">
  <div style="box-sizing:border-box;flex:1 1 100%;display:flex;align-items:center;gap:8px;min-width:0;padding:7px 11px;border-radius:9px;background:color-mix(in srgb, var(--color-primary) 12%, transparent);border:1px solid color-mix(in srgb, var(--color-primary) 30%, transparent)">
    <span style="box-sizing:border-box;flex:none">🌙</span>
    <span style="font-weight:700;font-size:13px;color:var(--foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{일시}}</span>
    <span style="margin-left:auto;min-width:0;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">📍 {{장소}}</span>
  </div>
  <div style="box-sizing:border-box;flex:1 1 30%;min-width:0;padding:6px 10px;border-radius:9px;background:color-mix(in srgb, var(--foreground) 6%, transparent);border:1px solid var(--border)">
    <div style="font-size:10px;color:var(--text-secondary)">관계</div>
    <div style="font-weight:700;font-size:13px;margin-top:2px;color:var(--foreground)">💗 {{관계}}</div>
  </div>
  <div style="box-sizing:border-box;flex:1 1 30%;min-width:0;padding:6px 10px;border-radius:9px;background:color-mix(in srgb, var(--foreground) 6%, transparent);border:1px solid var(--border)">
    <div style="font-size:10px;color:var(--text-secondary)">소원지</div>
    <div style="font-weight:700;font-size:13px;margin-top:2px;color:var(--foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">📜 {{소원지}}</div>
  </div>
  {{#gt 여우불 0}}
  <div style="box-sizing:border-box;flex:1 1 30%;min-width:0;padding:6px 10px;border-radius:9px;background:color-mix(in srgb, var(--color-primary) 10%, transparent);border:1px solid color-mix(in srgb, var(--color-primary) 30%, transparent)">
    <div style="font-size:10px;color:var(--text-secondary)">큰 여우불</div>
    <div style="font-weight:700;font-size:13px;margin-top:2px;color:var(--foreground)">🦊 {{여우불}} / 3</div>
  </div>
  {{/gt}}
</div>
