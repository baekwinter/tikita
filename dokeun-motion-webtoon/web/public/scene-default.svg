<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="달빛이 드는 학교 방송실">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2350"/><stop offset="1" stop-color="#2a2150"/>
    </linearGradient>
    <linearGradient id="room" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#171430"/><stop offset="1" stop-color="#0d0b1e"/>
    </linearGradient>
    <radialGradient id="moonglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#dfe8ff" stop-opacity="0.55"/><stop offset="1" stop-color="#8fb6ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fb6ff" stop-opacity="0.16"/><stop offset="1" stop-color="#8fb6ff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff5b6e" stop-opacity="0.45"/><stop offset="1" stop-color="#ff5b6e" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#room)"/>
  <!-- 창문 -->
  <rect x="860" y="110" width="560" height="420" rx="6" fill="url(#sky)" stroke="#39345a" stroke-width="10"/>
  <line x1="1140" y1="110" x2="1140" y2="530" stroke="#39345a" stroke-width="8"/>
  <line x1="860" y1="320" x2="1420" y2="320" stroke="#39345a" stroke-width="8"/>
