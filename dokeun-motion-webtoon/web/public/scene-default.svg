  <rect x="640" y="390" width="56" height="100" rx="28" fill="#2d2952" stroke="#4a4580" stroke-width="4" transform="rotate(38 668 440)"/>
  <text x="120" y="850" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="26" fill="#8a83a9" letter-spacing="2">도근고등학교 방송실 · 2026 추석 특별 방송</text>
