  <circle cx="1290" cy="210" r="46" fill="#e9eeff"/>
  <circle cx="1310" cy="198" r="44" fill="#1f2452" opacity="0.18"/>
  <g fill="#e9eeff" opacity="0.7"><circle cx="930" cy="170" r="2"/><circle cx="1010" cy="240" r="1.6"/><circle cx="1180" cy="150" r="1.6"/><circle cx="1380" cy="420" r="1.6"/><circle cx="960" cy="400" r="1.4"/></g>
  <path d="M860 530 L1420 530 L1300 900 L700 900 Z" fill="url(#beam)"/>
  <!-- ON AIR 램프 -->
