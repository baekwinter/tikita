  <rect x="120" y="600" width="980" height="180" rx="10" fill="#1d1a38" stroke="#312d57" stroke-width="4"/>
  <g fill="#2e2a57">
    <rect x="170" y="630" width="40" height="120" rx="6"/><rect x="240" y="630" width="40" height="120" rx="6"/><rect x="310" y="630" width="40" height="120" rx="6"/><rect x="380" y="630" width="40" height="120" rx="6"/>
  </g>
  <g fill="#d9a2a8"><rect x="176" y="690" width="28" height="12" rx="3"/><rect x="246" y="660" width="28" height="12" rx="3"/><rect x="316" y="710" width="28" height="12" rx="3"/><rect x="386" y="675" width="28" height="12" rx="3"/></g>
