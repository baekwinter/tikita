  <rect x="230" y="118" width="200" height="64" rx="8" fill="#241227" stroke="#ff5b6e" stroke-width="3"/>
  <text x="330" y="162" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="34" font-weight="700" fill="#ff7e8d" letter-spacing="6">ON AIR</text>
